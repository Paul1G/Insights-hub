<!doctype html>
<!-- lang="en" is the start-up value only. src/i18n.tsx owns
     document.documentElement.lang from there on and keeps it in sync with the
     active i18next language (WCAG 3.1.1 / 3.1.2) — do not hardcode a language
     here that i18n does not also start with. -->
<html lang="en" data-ix-theme="brand" data-ix-color-schema="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Model Studio</title>
    <script>
      // Theme bootstrap (runs before React mounts to avoid flash).
      // Restores the user's color-schema choice from localStorage and falls
      // back to the OS preference. The HTML element is the source of truth
      // for both data-ix-theme (brand — binding) and data-ix-color-schema.
      // See .claude/agents/ix-expert/75-brand-theme-overlay.md § 4.
      (function () {
        try {
          var stored = localStorage.getItem('ix-starter.color-schema');
          var mode = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-ix-color-schema', mode);
        } catch (_) { /* localStorage may throw in restrictive contexts */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
