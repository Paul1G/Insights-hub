  parameters:
    TypeId:
      name: id
      in: path
      description: |
        The type's id is a unique identifier. The id's length must be between 1 and 128 characters and matches
        the following symbols "A-Z", "a-z", "0-9", "_" and "." beginning with the tenant name what has a maximum of 8 characters.
        (e.g . tenant_name.type_id).

        **Note:** tenant name is the name of tenant can be obtained using TenantManagements /tenantInfo API [TM API Link](https://documentation.mindsphere.io/MindSphere/apis-xcelerator/core-tenantmanagement/api-tenantmanagement-api.html).
      required: true
      schema:
        type: string
        pattern: '[A-Za-z0-9_]{1,8}\.[A-Za-z0-9_]+'
        minLength: 1
        maxLength: 128
    uniqueId:
      name: id
      in: path
      description: Unique identifier
      required: true
      schema:
        type: string
        pattern: '[0-9A-F]{32}'
    fileKey:
      name: key
      in: path
      description: Keyword for the file to be assigned to an asset or asset type.
      required: true
      schema:
        type: string
        pattern: '[\w]+'
    fileId:
      name: fileId
      in: path
      description: Unique identifier of the file.
      required: true
      schema:
        type: string
        pattern: '[0-9A-F]{32}'
    page:
      name: page
      in: query
      description: Specifies the requested page index
      schema:
        type: integer
    size:
      name: size
      in: query
      description: Specifies the number of elements in a page (default size is 10)
      schema:
        type: integer
    sort:
      name: sort
      in: query
      description: Specifies the ordering of returned elements
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: Specifies the additional filtering criteria
      schema:
        type: string
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: ETag hash of previous request to allow caching
      schema:
        type: string
    ifNoneMatchStar:
      name: If-None-Match
      in: header
      description: Set ifNoneMatch header to "*" for ensuring create request
      schema:
        type: string
    ifMatch:
      name: If-Match
      in: header
      description: 'Last known version to facilitate optimistic locking.

        *Required for modification.

        '
      schema:
        type: string
    ifMatchMandatory:
      name: If-Match
      in: header
      description: Last known version to facilitate optimistic locking
      required: true
      schema:
        type: string
    ifMatchVariable:
      name: If-Match
      in: header
      description: Last known version of asset type to facilitate optimistic locking. Etag from asset type response to be
        used.
      required: true
      schema:
        type: string
    exploded:
      name: exploded
      in: query
      description: Specifies if the asset type should include all of it's inherited variables and aspects. Default is false.
      schema:
        type: boolean
    includeShared:
      name: includeShared
      in: query
      description: Specifies if the operation should take into account shared (received) assets, aspects and asset types.
        Received resources are not visible in case includeShared=false. For query operations, received resources are not returned.
        Endpoints addressing individual resources respond with 404. In case received resources are referenced in a request
        parameter or property, they are treated as not existing.
      schema:
        type: boolean
        default: false
    basicFieldsOnly:
      name: basicFieldsOnly
      in: query
      description: Specifies if the assets should include all of it's inherited variables and aspects from assettype and aspecttype.
      schema:
        type: boolean
        default: false
