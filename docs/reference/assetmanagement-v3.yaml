  /aspecttypes/{id}/variables:
    patch:
      tags:
        - aspecttype
      summary: patch aspect type variables
      operationId: updateAspectTypeVariable
      description: 'Updates an existing variable defined on an aspect type. Variables can be added, deleted and updated using
        this operation. Any variable which is not part of the request will remain unchanged. All variable names must be unique
        in a aspect type. This operation will increment the aspect type etag value.


        <b>Following are the updates allowed on existing variables</b>

        * Variable''s Name, Length, Default Value and Unit can be changed.

        * The unit changes from the api does not compute any value changes derived after the unit changes, the values will
        remain as it is and only the unit will be updated.

        * The length can only be increased of a string variable and it cannot be decreased.

        '
      parameters:
        - $ref: '#/components/parameters/ifMatchVariable'
        - $ref: '#/components/parameters/TypeId'
      requestBody:
        description: 'Variables Dictionary, where variable Name is the key and value is the variable definition object.

          * To update existing variable in aspect type, dictionary should contain key as variable name and value as variable
          object with details to be updated.

          * To delete variables, key should be name of the variable to be deleted and value should be null.

          * To add new variables, key should be non exisiting variable name and value should be variable definition object.'
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/aspectVariableUpdateMap'
      responses:
        '204':
          description: The variable's has been updated
          headers:
            ETag:
              description: AspectType ETag value for further updates
              schema:
                type: integer
        '400':
          description: Invalid request
