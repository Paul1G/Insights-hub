          properties:
            href:
              type: string
              format: uri
              description: Link to download the file
        metadata:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: Link to get metadata of the file
        origin:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: Link to access the file assignment. Only visible if assignment is inherited
    Variable:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[a-zA-Z0-9_]+'
          example: color
        value:
          type: string
          minLength: 1
          maxLength: 255
          example: yellow
    VariableUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[a-zA-Z_][a-zA-Z0-9_]*'
          description: Name of the variable. Reserved words (id, name, description, tenant, etag, scope, properties, propertySets,
            extends, variables, aspects, parentTypeId) cannot be used as variable names.
          example: temperature
        unit:
          type: string
          maxLength: 32
          pattern: '[^\'']*'
          description: Unit of measurement. Can be changed
          example: C/F
        length:
          type: integer
          minimum: 1
          maximum: 100000
          description: The max length of the variable's value. The length field is only used for variables of string or big_string
            dataType. Max length for string is 255 and max length for big_string 100000. Cannot be changed.
          example: 5
        defaultValue:
          type: string
          minLength: 1
          maxLength: 255
          description: The default value of the variable. It must be compatible with the dataType! The default value will
            be inherited by the asset type's child types and by the asset instantiating it. It can be defined in aspect types
            and asset types.
          example: 25/77
    VariableDefinition:
      allOf:
        - $ref: '#/components/schemas/VariableUpdate'
      required:
        - name
        - dataType
      properties:
        dataType:
          type: string
          enum:
            - BOOLEAN
            - INT
            - LONG
            - DOUBLE
            - STRING
            - TIMESTAMP
            - BIG_STRING
          description: Data type of the variable. BIG_STRING could only be used by variables in dynamic aspect-types. Cannot
            be changed.
          example: STRING
        searchable:
          type: boolean
          default: false
          description: Indicates whether sorting and filtering is allowed on this variable. Only usable for static properties.
            Cannot be changed.
          example: true
    VariableDefinitionResource:
      allOf:
        - $ref: '#/components/schemas/VariableDefinition'
        - properties:
            _links:
              properties:
                origin:
                  description: Link to the asset type defining the variable. *Only visible if variable is inherited.*
                  properties:
                    href:
                      type: string
    aspectVariableUpdateMap:
      additionalProperties:
        $ref: '#/components/schemas/VariableDefinition'
      example:
        temperature:
          name: engine_temperature
          unit: C/F
          length: 5
          defaultValue: 25/77
          dataType: STRING
          searchable: true
          qualityCode: true
        newVariable:
          name: newVariable
          unit: C/F
          length: 5
          defaultValue: 25/77
          dataType: STRING
          searchable: true
          qualityCode: true
        removeVariable: null
    VariableUpdateMap:
      additionalProperties:
        $ref: '#/components/schemas/VariableUpdate'
      example:
        temperature:
          name: engine_temperature
          unit: C/F
          length: 5
          defaultValue: 25/77
    KeyedFileAssignment:
      type: object
      properties:
        fileId:
          type: string
          description: The id of the file to be assigned
          example: c27a28b6eb16b507fabc11e75da8b4ce
    FileAssignment:
      type: object
      properties:
        key:
          type: string
          pattern: '[\w]+'
          example: logo_small
          description: Keyword for the file to be assigned to an asset.
        fileId:
          type: string
          example: c27a28b6eb16b507fabc11e75da8b4ce
          description: The id of the file to be assigned
    FileMetadataResource:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uniqueId'
        name:
          type: string
          description: File name given by the user
          example: logo
        originalFileName:
          type: string
          description: Original filename of the file
          example: logo_small.png
        description:
          type: string
          description: File description
          example: Company logo
        tenantId:
          $ref: '#/components/schemas/tenantId'
        subTenant:
          type: string
          description: The id of the end-customer
          example: UnkarPlutt Inc.
        uploaded:
          description: The time of the file upload
          type: string
          format: date-time
        lastModified:
          description: The time of the latest modification of the file
          type: string
          format: date-time
        isAssigned:
          description: Is the file used in any file assignment
          type: boolean
          example: false
        scope:
          type: string
          enum:
            - public
            - private
          default: private
          example: private
          description: The visibility of the file. PRIVATE hides files between subTenants and the t1Tenant's files from the
            subTenants. PUBLIC is visible for every user of the tenant.
        etag:
          $ref: '#/components/schemas/ETag'
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/rel.self'
            download:
              title: link for downloading the file
              properties:
                href:
                  type: string
    tenantId:
      type: string
      pattern: '[a-zA-Z0-9-_.]+'
      maxLength: 255
      description: The unique identifier of the tenant
      example: mdsp
    enabled:
      type: boolean
      description: Describes the state of model lock
      example: true
    jobs:
      type: array
      items:
        type: string
      description: Describes Jobs associtated with Model Lock
      example:
        - mdsp-import-md33d31
    timezone:
      type: string
      maxLength: 255
      description: The timezone to be used for timeseries aggregation. By default it is inherited from the tenant's defaultTimezone,
        but can be overwritten only during asset creation. The timezone value should be set to a Java time zone ID such as
        "America/LosAngeles" or "Etc/GMT+2". Time zones that 15 or 45 minutes off a UTC hour are not supported, such as Nepal
        standard time (UTC+05:45). Time zones that are 30 minutes off a UTC hour are supported, such as India (UTC+05:30).
        Once an asset is created with a specific timezone, it cannot be changed later.
      example: Europe/Berlin
    AssetTypeId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '[A-Za-z0-9_]{1,8}\.[A-Za-z0-9_]+'
      description: |
        The asset type's id is a unique identifier. The id's length must be between 1 and 128 characters and matches
        the following symbols "A-Z", "a-z", "0-9", "_" and "." beginning with the tenant name what has a maximum of 8 characters.
        (e.g . tenant_name.type_id). Once set cannot be changed.

        **Note:** tenant name is the name of tenant can be obtained using TenantManagements /tenantInfo API [TM API Link](https://documentation.mindsphere.io/MindSphere/apis-xcelerator/core-tenantmanagement/api-tenantmanagement-api.html).
      example: mdsp.spaceship
    AspectId:
      type: string
      description: Aspect id is an internal id of an aspect associated with an asset type.
      example: b9cbfc7073be4530887cdb1e71c932b8
    AspectTypeId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '[A-Za-z0-9_]{1,8}\.[A-Za-z0-9_]+'
      description: |
        The aspect type's id is a unique identifier. The id's length must be between 1 and 128 characters and matches
        the following symbols "A-Z", "a-z", "0-9", "_" and "." beginning with the tenant name what has a maximum of 8 characters.
        (e.g . tenant_name.type_id). Once set cannot be changed.

        **Note:** tenant name is the name of tenant can be obtained using TenantManagements /tenantInfo API [TM API Link](https://documentation.mindsphere.io/MindSphere/apis-xcelerator/core-tenantmanagement/api-tenantmanagement-api.html).
      example: mdsp.wing
    Page:
