        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/fileKey'
        - $ref: '#/components/parameters/includeShared'
      requestBody:
        description: Data for file assignment
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyedFileAssignment'
      responses:
        '200':
          description: The assignment has been updated or a new assignment has been added
          content:
            application/hal+json:
              schema: &id032
                $ref: '#/components/schemas/AssetTypeResource'
            application/vnd.error+json:
              schema: *id032
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id033
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id033
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id034
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id034
        '404':
          description: Asset type not found
          content:
            application/hal+json:
              schema: &id035
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id035
        '412':
          description: Asset type or the file assignment has changed in the background
          content:
            application/hal+json:
              schema: &id036
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id036
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
