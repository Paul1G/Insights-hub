components:
  schemas:
    AssetTypeBase:
      type: object
      required:
        - name
        - parentTypeId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\p{L}_0-9_\. ]+'
          description: The type's name.
          example: X_Wing
        description:
          type: string
          description: description
          maxLength: 255
          example: Hyperspace jump capable space ship
        parentTypeId:
          $ref: '#/components/schemas/AssetTypeId'
        instantiable:
          type: boolean
          default: true
          example: true
          description: If instances can be created from this type. A instantiable type
            could not be changed to be non-instantiable.
        scope:
          type: string
          enum:
            - public
            - private
          default: private
          example: private
          description: Visibility of the assettype. Setting this property to public makes it available to other tenants. Private
            types are only visible to the user's own tenant. Currently only private types could be created.
    AssetTypeBasePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[\p{L}_0-9_\. ]+'
          description: The type's name.
          example: X_Wing
        description:
          type: string
          description: description
          maxLength: 255
          example: Hyperspace jump capable space ship
        parentTypeId:
          $ref: '#/components/schemas/AssetTypeId'
        instantiable:
          type: boolean
          default: true
          example: true
          description: If instances can be created from this type. A non-instantiable type could be changed to be instantiable
            but not the other way around.
        scope:
          type: string
          enum:
            - public
            - private
          default: private
          example: private
          description: 'Visibility of the assettype. Setting this property to public makes it available to other tenants.
            Private types are only visible to the user''s own tenant. Currently only private types could be created.        '
    AssetTypePatch:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssetTypeBasePatch'
        - properties:
            aspects:
              type: array
              description: Aspects of the asset-type.
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: '[a-zA-Z0-9_]+'
                    example: leftWing
                    description: Name of the aspect. It has to be unique inside the type-family (ancestors and descendants).
                      Reserved words (id, name, description, tenant, etag, scope, properties, propertySets, extends, variables,
                      aspects, parentTypeId) cannot be used as aspect names.
                  aspectId:
                    $ref: '#/components/schemas/AspectId'
                  aspectTypeId:
                    $ref: '#/components/schemas/AspectTypeId'
            variables:
              type: array
              description: Direct variables of the asset-type. Variable names has to be unique inside the whole type-family
                (ancestors and descendants). Once added variables cannot be changed or removed.
              items:
                $ref: '#/components/schemas/VariableDefinition'
            fileAssignments:
              type: array
              items:
                $ref: '#/components/schemas/FileAssignment'
    AssetType:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssetTypeBase'
        - properties:
            aspects:
              type: array
              description: Aspects of the asset-type.
              items:
                type: object
                required:
                  - name
                  - aspectTypeId
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: '[a-zA-Z0-9_]+'
                    example: leftWing
                    description: Name of the aspect. It has to be unique inside the type-family (ancestors and descendants).
                      Reserved words (id, name, description, tenant, etag, scope, properties, propertySets, extends, variables,
                      aspects, parentTypeId) cannot be used as aspect names.
                  aspectId:
                    $ref: '#/components/schemas/AspectId'
                  aspectTypeId:
                    $ref: '#/components/schemas/AspectTypeId'
            variables:
              type: array
              description: Direct variables of the asset-type. Variable names has to be unique inside the whole type-family
                (ancestors and descendants). Once added variables cannot be changed or removed.
              items:
                $ref: '#/components/schemas/VariableDefinition'
            fileAssignments:
              type: array
              items:
                $ref: '#/components/schemas/FileAssignment'
    AssetTypeResource:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssetTypeBase'
        - properties:
            id:
              $ref: '#/components/schemas/AssetTypeId'
            tenantId:
              $ref: '#/components/schemas/tenantId'
            etag:
              $ref: '#/components/schemas/ETag'
            aspects:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the aspect type, it must be unique for the asset type.
                    example: leftWing
                  aspectId:
                    $ref: '#/components/schemas/AspectId'
                  aspectType:
                    allOf:
                      - $ref: '#/components/schemas/AspectTypeResource'
                  _links:
                    type: object
                    properties:
                      origin:
                        type: object
                        properties:
                          href:
                            type: string
                            description: Link to the asset type defining the aspect. *Only visible if aspect is inherited.*
            variables:
              type: array
              description: Direct variables of the asset-type. Variable names has to be unique inside the whole type-family
                (ancestors and descendants). Once added variables cannot be changed or removed.
              items:
                $ref: '#/components/schemas/VariableDefinitionResource'
            fileAssignments:
              type: array
              items:
                $ref: '#/components/schemas/FileAssignmentResource'
            sharing:
              $ref: '#/components/schemas/SharingResource'
            _links:
              $ref: '#/components/schemas/AssetTypeLinks'
    AssetTypeLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/rel.self'
        parent:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: Link to the parent asset type
    AspectType:
      type: object
      required:
        - name
        - category
        - scope
        - variables
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[a-zA-Z0-9_]+'
          description: Name of the aspect type. It has to be unique inside the tenant and cannot be changed later.
          example: engine
        category:
          type: string
          enum:
            - static
            - dynamic
          description: If the aspect-type is used for static data or time-series. Cannot be changed once the aspect-type is
            created.
        scope:
          type: string
          enum:
            - public
            - private
          default: private
          example: private
          description: Visibility of aspecttype. Setting this property to public makes it available to other tenants. Private
            types are only visible to the user's own tenant. Currently only private types can be created.
        description:
          type: string
          maxLength: 255
          pattern: '[^\'']*'
          description: The description of the aspect type
          example: The engine of the Millenium Falcon
        variables:
          type: array
          minItems: 1
          description: Variables of the aspect-type. Variable names should be unique inside an aspect-type.
          items:
            $ref: '#/components/schemas/AspectVariable'
    AspectTypePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[a-zA-Z0-9_]+'
          description: Name of the aspect type. It has to be unique inside the tenant and cannot be changed later.
          example: engine
        category:
          type: string
          enum:
            - static
            - dynamic
          description: If the aspect-type is used for static data or time-series. Cannot be changed once the aspect-type is
            created.
        scope:
          type: string
          enum:
            - public
            - private
          default: private
          example: private
          description: Visibility of aspecttype. Setting this property to public makes it available to other tenants. Private
            types are only visible to the user's own tenant. Currently only private types can be created.
        description:
          type: string
          maxLength: 255
          pattern: '[^\'']*'
          description: The description of the aspect type
          example: The engine of the Millenium Falcon
        variables:
          type: array
          minItems: 1
          description: Variables of the aspect-type. Variable names should be unique inside an aspect-type.
          items:
            $ref: '#/components/schemas/AspectVariable'
    AspectTypeResource:
      type: object
