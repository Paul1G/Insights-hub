  /assettypes/{id}/variables:
    patch:
      tags:
        - assettype
      summary: Update variables from an asset type
      operationId: updateAssetTypeVariable
      description: 'Updates an existing variable defined on an asset type. Variables cannot be added or deleted using this
        operation, for adding or deleting variables use patch/put assettype api. Any variable which is not part of the request
        will remain unchanged. Variable''s Name, Length, Default Value and Unit can be changed. The unit changes from the
        api does not compute any value changes derived after the unit changes, the values will remain as it is and only the
        unit will be updated. The length can only be increased of a string variable and it cannot be decreased. This operation
        will increment the asset type etag value.

        '
      parameters:
        - $ref: '#/components/parameters/ifMatchVariable'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/includeShared'
      requestBody:
        description: Variables Dictionary, Variable Name is the key and value are the parameters to be updated of the variable.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/VariableUpdateMap'
      responses:
        '204':
          description: The variable's has been updated
          headers:
            ETag:
              description: AssetType ETag value for further updates
              schema:
                type: integer
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id044
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id044
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id045
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id045
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id046
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id046
        '404':
          description: Variable not found in Asset type
          content:
            application/hal+json:
              schema: &id047
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id047
        '412':
          description: Asset type or the variable has been changed in the background
          content:
            application/hal+json:
              schema: &id048
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id048
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id049
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id049
      security:
        - assettype:
            - atm.w
