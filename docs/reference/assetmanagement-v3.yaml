        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/includeShared'
      responses:
        '200':
          description: Array of aspect types matched the tenant scope and filter criterias
          headers:
            ETag:
              description: Shallow ETag of the resource
              schema:
                type: string
          content:
            application/hal+json:
              schema: &id050
                $ref: '#/components/schemas/AspectTypeListResource'
            application/vnd.error+json:
              schema: *id050
        '304':
          description: Aspect-types page not changed
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id051
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id051
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id052
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id052
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id053
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id053
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id054
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id054
      security:
        - aspecttype:
            - atm.apt.r
  /aspecttypes/{id}:
    get:
      tags:
        - aspecttype
      summary: Read an aspect type
      operationId: getAspectType
      description: Read an aspect type.
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/includeShared'
      responses:
        '200':
          description: Returns the aspect type
          content:
            application/hal+json:
              schema: &id055
                $ref: '#/components/schemas/AspectTypeResource'
            application/vnd.error+json:
              schema: *id055
        '304':
          description: AspectType not changed
          content:
            application/hal+json:
              schema: &id056
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id056
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id057
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id057
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id058
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id058
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id059
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id059
        '404':
          description: AspectType not found
          content:
            application/hal+json:
              schema: &id060
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id060
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id061
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id061
      security:
        - aspecttype:
            - atm.apt.r
    put:
      tags:
        - aspecttype
      summary: Create or Update an aspect type
      operationId: saveAspectType
      description: 'Create or Update an aspect type. Only adding variables and restricted updates on variables is supported,
        like user can change unit details, can increase the length of a static STRING variable but length of a dynamic STRING
        variable cannot be changed. In order to rename or remove variable, use PATCH /aspecttypes/{id}/variables api. Default
        value field is available only for static aspect variables and not on dynamic aspect variable. Aspect type description
        should not contain single quote character.

        '
      parameters:
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/ifNoneMatchStar'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/includeShared'
      requestBody:
        description: aspect type
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AspectType'
      responses:
        '200':
          description: The aspect type has been updated
          content:
            application/hal+json:
              schema: &id062
                $ref: '#/components/schemas/AspectTypeResource'
            application/vnd.error+json:
              schema: *id062
        '201':
