        location:
          $ref: '#/components/schemas/Location'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        aspects:
          type: array
          items:
            $ref: '#/components/schemas/Aspect'
        fileAssignments:
          type: array
          items:
            $ref: '#/components/schemas/FileAssignment'
    AssetUpdatePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '[^\/\\]*'
          description: Name of the asset
          example: Millenium Falcon
        externalId:
          type: string
          description: The id given by the user
          maxLength: 255
          example: SN 123456-123-123456
        description:
          type: string
          description: The description of the asset
          maxLength: 255
          pattern: '[^'']*'
          example: The ship of Han Solo and Chewbacca
        location:
          $ref: '#/components/schemas/Location'
        variables:
