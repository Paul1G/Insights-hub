openapi: 3.0.1
info:
  description: Service for configuring, reading and managing assets, asset types and aspect types.
  version: 3.19.0
  x-visibility: external
  title: Asset Management API
servers:
  - url: https://api.eu1.siemens.app/assetmanagement-1000001700/v3
    description: Xcelerator compliant URL
tags:
  - name: aspecttype
    description: Managing static and dynamic aspect types.
  - name: assettype
    description: Managing asset types.
  - name: assets
    description: Managing users' assets and their locations. Assets only can be created by types which are in three main topics;
      device types, agent types and hierarchy types.
  - name: structure
    description: Managing structure of specific assets.
  - name: locations
    description: Managing locations.
  - name: files
    description: Managing files.
  - name: assetmodellock
    description: Managing locks on asset model
  - name: billboard
paths:
  /:
    get:
      tags:
        - billboard
      summary: List all links for available resources
      operationId: getBillboard
      description: List all links for available resources
      responses:
        '200':
          description: Array of links to available resources
          content:
            application/hal+json:
              schema: &id001
                $ref: '#/components/schemas/BillboardResource'
            application/vnd.error+json:
              schema: *id001
      security:
        - assettype:
            - atm.r
  /assettypes:
    get:
      tags:
        - assettype
      summary: List all asset types
      operationId: listAssetTypes
      description: List all asset types
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/exploded'
        - $ref: '#/components/parameters/includeShared'
      responses:
        '200':
          description: Array of asset types matched the tenant scope and filter criterias
          headers:
            ETag:
              description: Shallow ETag of the resource
              schema:
                type: string
          content:
            application/hal+json:
              schema: &id002
                $ref: '#/components/schemas/AssetTypeListResource'
            application/vnd.error+json:
              schema: *id002
        '304':
          description: Asset-types page not changed
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id003
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id003
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id004
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id004
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id005
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id005
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id006
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id006
      security:
        - assettype:
            - atm.r
        - aspecttype:
            - atm.apt.r
  /assettypes/{id}:
    get:
      tags:
        - assettype
      summary: Read an asset type
      operationId: getAssetType
      description: Read an asset type
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/exploded'
        - $ref: '#/components/parameters/includeShared'
      responses:
        '200':
          description: Returns the asset type
          content:
            application/hal+json:
              schema: &id007
                $ref: '#/components/schemas/AssetTypeResource'
            application/vnd.error+json:
              schema: *id007
        '304':
          description: AssetType not changed
          content:
            application/hal+json:
              schema: &id008
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id008
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id009
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id009
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id010
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id010
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id011
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id011
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id012
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id012
      security:
        - assettype:
            - atm.r
        - aspecttype:
            - atm.apt.r
    put:
      tags:
        - assettype
      summary: Create or Update an asset type
      operationId: saveAssetType
      description: "Create or Update an asset type. Complete asset type model payload should be provided in request.\n\n <b>\
        \ Following are the updates allowed</b>\n\n* Asset type description can be updated.\n* Asset type variable's can be\
        \ created, updated and removed. Varaible length, default Value and Unit can be changed. The unit changes from the\
        \ API does not compute any value changes derived after the unit changes, the values will remain as it is and only\
        \ the unit will be updated. The length can only be increased of a string variable and it cannot be decreased.\n* File\
        \ assignments can be updated and removed.\n\n* Aspects can be created, updated and removed, please refer sample payloads\
        \ below\n\n  * Create aspect\n        {\n          \"name\": \"leftWing\",\n          \"aspectTypeId\": \"mdsp.wing\"\
        \n        }\n  * Update aspect <b><u>aspectId should be provided in payload</u></b> (only name can be updated)\n \
        \     {\n             \"name\": \"rightWing\",\n             \"aspectId\": \"b9cbfc7073be4530887cdb1e71c932b8\",\n\
        \             \"aspectTypeId\": \"mdsp.wing\"\n       }\n  * To delete an aspect, aspect should not be part of aspects\
        \ payload\n"
      parameters:
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/ifNoneMatchStar'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/exploded'
        - $ref: '#/components/parameters/includeShared'
      requestBody:
        description: asset type
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: The asset type has been updated
          content:
            application/hal+json:
              schema: &id013
                $ref: '#/components/schemas/AssetTypeResource'
            application/vnd.error+json:
              schema: *id013
        '201':
          description: The asset type has been created
          content:
            application/hal+json:
              schema: &id014
                $ref: '#/components/schemas/AssetTypeResource'
            application/vnd.error+json:
              schema: *id014
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id015
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id015
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id016
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id016
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id017
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id017
        '412':
          description: AssetType is changed in the background
          content:
            application/hal+json:
              schema: &id018
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id018
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id019
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id019
      security:
        - assettype:
            - atm.w
        - aspecttype:
            - atm.apt.r
        - file:
            - atm.fa.w
            - atm.fa.d
    delete:
      tags:
        - assettype
      summary: Delete an asset type
      operationId: deleteAssetType
      description: Deletes an asset type. Deletion only possible when the type has no child-type and there is no asset that
        instantiate it.
      parameters:
        - $ref: '#/components/parameters/ifMatchMandatory'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/includeShared'
      responses:
        '204':
          description: Asset type deletion was successful
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id020
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id020
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id021
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id021
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id022
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id022
        '412':
          description: AssetType is changed in the background
          content:
            application/hal+json:
              schema: &id023
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id023
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id024
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id024
      security:
        - assettype:
            - atm.d
    patch:
      tags:
        - assettype
      summary: Patch an asset type
      operationId: updateAssetType
      description: "Patch an asset type. Conforms to RFC 7396 - JSON merge Patch.\n<b> Following are the updates allowed</b>\n\
        * Asset type description can be updated.\n* Asset type variable's can be created, updated and removed. Varaible length,\
        \ default Value and Unit can be changed. The unit changes from the API does not compute any value changes derived\
        \ after the unit changes, the values will remain as it is and only the unit will be updated. The length can only be\
        \ increased of a string variable and it cannot be decreased.\n* File assignments can be updated and removed.\n\n*\
        \ Aspects can be created, updated and removed, please refer sample payloads below\n\n  * Create aspect\n        {\n\
        \          \"name\": \"leftWing\",\n          \"aspectTypeId\": \"mdsp.wing\"\n        }\n  * Update aspect, <b><u>aspectId\
        \ should be provided in payload</u></b> (only name can be updated)\n      {\n             \"name\": \"rightWing\"\
        ,\n             \"aspectId\": \"b9cbfc7073be4530887cdb1e71c932b8\",\n             \"aspectTypeId\": \"mdsp.wing\"\n\
        \       }\n  * To delete an aspect, aspect should not be part of aspects payload\n"
      parameters:
        - $ref: '#/components/parameters/ifMatchMandatory'
        - $ref: '#/components/parameters/TypeId'
        - $ref: '#/components/parameters/exploded'
        - $ref: '#/components/parameters/includeShared'
      requestBody:
        description: asset type
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AssetTypePatch'
      responses:
        '200':
          description: The asset type has been updated
          content:
            application/hal+json:
              schema: &id025
                $ref: '#/components/schemas/AssetTypeResource'
            application/vnd.error+json:
              schema: *id025
        '400':
          description: Invalid request
          content:
            application/hal+json:
              schema: &id026
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id026
        '401':
          description: User is not authenticated
          content:
            application/hal+json:
              schema: &id027
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id027
        '403':
          description: User is not authorized for request
          content:
            application/hal+json:
              schema: &id028
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id028
        '404':
          description: AssetType not found
          content:
            application/hal+json:
              schema: &id029
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id029
        '412':
          description: AssetType is changed in the background
          content:
            application/hal+json:
              schema: &id030
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id030
        '500':
          description: Server error, for more information see errorcode and message
          content:
            application/hal+json:
              schema: &id031
                $ref: '#/components/schemas/errors'
            application/vnd.error+json:
              schema: *id031
      security:
        - assettype:
            - atm.w
        - aspecttype:
            - atm.apt.r
        - file:
            - atm.fa.w
            - atm.fa.d
  /assettypes/{id}/fileAssignments/{key}:
